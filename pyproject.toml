[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-core"
version = "0.1.0"
description = "Shared research engine primitives for Tender Designer, Internet Pricing, and Should-Cost Intelligence"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "zageabb"}]
license = {text = "MIT"}
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[tool.setuptools.packages.find]
include = ["research_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
